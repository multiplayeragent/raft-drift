<script type="module">
/* ═══ RAFT DRIFT · a Multiplayer Agent starter ════════════════════════════════════════════
 * Hook what floats past, build the raft bigger, keep the shark off it. Co-op, 1–6 players.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ the raft, debris, the hook, the shark, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   WORLD MEMORY .. how the raft survives the room emptying (same code as voxel-builders)
 *   RAFT .......... the tile grid: how tiles are packed into one shared field, what can be built
 *   SEA ........... waves, the raft, the mast, floating debris, the shark (all drawn in code)
 *   CREW .......... the crew model, name tags, hooks and their ropes
 *   EFFECTS ....... particles, floating "+2 wood" pops, sounds
 *   SEA (HOST) .... debris drifting and reeling in, the shark's brain, building, bots. Host only.
 *   ME ............ walking, swimming, throwing the hook, building, getting chomped
 *   HUD ........... the crew's stash, build button, the card when the shark gets you, leaderboard
 *   INPUT ......... keyboard + mouse, a thumb stick and tap-to-throw on touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code, the HOST's browser runs the sea):
 *   - Each player writes its OWN entity: `p` (one JSON field: x, z, facing, swimming, where
 *     its hook is) about 10 times a second, `hb` (heartbeat) once a second, `n`/`c` (name, color).
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields:
 *       `raft`   every tile, one character per spot (see RAFT)
 *       `crew`   {w, r, hooked}: the crew's wood and rope, and who hooked what
 *       `rev`    how many tiles PEOPLE have built (world memory compares it)
 *       `debris` everything floating past, and who is reeling what in, 10 times a second
 *       `shark`  {x, z, h, st, hits, tile, until}: where it is and what it is doing, 10 times a second
 *       `bots`   the AI crew, 10 times a second
 *     A new host adopts all of it from state and carries on: same raft, same shark.
 *   - Your hook flies on your own screen. If it lands on debris you send "hook" {i}; the host
 *     marks it as yours and reels it to you, and its wood and rope go to the crew. If it lands on
 *     the shark you send "smack" {}; enough smacks and the shark swims off. "build" {x, y} asks
 *     for a tile; the host checks the spot and the crew's stash. Its own intents apply directly.
 *   - The shark chomps swimmers by event: the host sends "chomp" {to} and only that player
 *     shows the card and climbs back aboard.
 *   - The raft and the crew's stash outlive the room through WORLD MEMORY (see that section).
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "raft-size": the biggest raft (in tiles) each player has sailed on.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  grid: 21,              // the raft can grow over grid × grid spots ...
  tile: 2,               // ... each this many units across
  tileHp: 3,             // shark bites a tile takes before it breaks (the first 3×3 never breaks)
  cost: { w: 4, r: 1 },  // one new tile, from the crew's stash
  startStash: { w: 8, r: 2 },
  drift: 1.6,            // how fast the sea carries debris past, units/s
  maxDebris: 14,         // most pieces floating at once
  debrisEvery: 0.9,      // seconds between new pieces
  debrisSpread: 24,      // pieces float past this far either side of the raft
  hookRange: 14,         // how far you can throw the hook
  hookSpeed: 24,         // how fast it flies, units/s
  hookGrab: 1.7,         // it catches a piece this close to where it lands
  reelSpeed: 9,          // a hooked piece comes in this fast
  walk: 5,               // walking speed on the raft
  swim: 2.4,             // swimming speed
  sharkSpeed: 5.5,       // units/s
  sharkHits: 3,          // smacks before the shark swims off
  sharkBiteMs: 1300,     // ms between bites on a tile
  sharkRestMs: [5000, 10000], // it circles this long between attacks
  sharkFleeMs: 9000,     // after enough smacks it stays away this long
  sharkGraceMs: 1500,    // someone in the water this long gets hunted (time to climb back after a slip)
  seats: 4,              // bots fill the crew up to this many
  botThrowMs: [2500, 4500], // a bot waits this long between throws (they leave plenty for you)
  botReserve: 4,         // wood the bots leave for each person in the crew
  botLeave: 2,           // bots leave alone the pieces nearest each person (and what a person's hook flies at)
  saveNs: "raft-drift",  // player-save namespace for world memory
  saveEvery: 10000,      // ms between world-memory saves
  board: "raft-size",    // leaderboard name
};
// What floats past: how often (weight) and what it gives the crew (w = wood, r = rope).
const DEBRIS = {
  plank: { weight: 6, w: 2, r: 0 },
  rope: { weight: 3, w: 0, r: 1 },
  barrel: { weight: 2, w: 3, r: 2 },
  crate: { weight: 1, w: 5, r: 3 },
};
const COLORS = ["#ff7b54", "#4ab3ff", "#ffd23f", "#7ee081", "#c792ff", "#ff6fae", "#39d5c9", "#f2f2f2"];
const BOT_NAMES = ["Marlo", "Wren", "Skip", "Nori", "Tula", "Bix"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'raft-drift',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A value from state, decoded once per change. Read-only: never mutate what this returns. */
function parseOnce(key, raw, decode) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = decode(raw); parsed.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
let player = null; // MP.auth client: world-memory saves + the leaderboard (null offline)
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;

// ── WORLD MEMORY ────────────────────────────────────────────────────────────────────
// A relay room forgets everything when its last player leaves, so the PLAYERS remember the raft:
//   1. Every CONFIG.saveEvery ms and when the page closes, each player saves a copy of the raft
//      and the crew's stash with its `rev` (how many tiles PEOPLE built; bots don't count, so a
//      fresh raft grown by bots never beats a saved one) to its player save (player.data,
//      namespace CONFIG.saveNs) and to this browser (localStorage). A copy with a higher rev
//      than the live raft is never overwritten: it is kept and offered.
//   2. The first player into an empty room becomes host and loads its copy into shared.
//   3. A player who joins holding a copy with a HIGHER rev than the live raft offers it: it
//      writes the copy into its own entity (`wmh` header, `wm0`, `wm1`… chunks under 2048
//      characters) and the host adopts it. The copy with more building in it wins.
// The game supplies worldSnapshot(), liveRev() (-1 = no raft yet) and loadWorld(world, rev).
const memory = { saved: null, ready: false, cloud: null, lastJson: "", lastSave: 0, offerRev: 0, offerN: 0 };
const memoryKey = () => "mpa-world:" + MP_CONNECT.room + (net.offline ? ":offline" : "");

/** Read my copy: this browser's and my cloud save, whichever has the higher rev. */
async function loadMemory() {
  let best = null;
  try { best = JSON.parse(localStorage.getItem(memoryKey()) || "null"); } catch {}
  if (player) {
    try {
      const doc = (await player.data.get(CONFIG.saveNs)).data;
      if (doc && doc.room === MP_CONNECT.room && doc.world && (!best || doc.rev > best.rev)) best = doc;
      memory.cloud = true;
    } catch (e) { memory.cloud = false; console.warn("World memory: no cloud save, this browser only:", e && e.message); }
  }
  memory.saved = best && best.room === MP_CONNECT.room && best.world && typeof best.rev === "number" ? best : null;
  memory.lastJson = memory.saved ? JSON.stringify(memory.saved.world) : "";
  memory.ready = true;
}

/** Save my copy of the live raft, unless it is unchanged or older than the copy I hold. */
function rememberWorld() {
  if (ATTRACT || !memory.ready) return;
  const rev = liveRev();
  if (rev < 0 || (memory.saved && rev < memory.saved.rev)) return; // mine is newer: keep it, keep offering it
  const doc = { room: MP_CONNECT.room, rev, at: Date.now(), world: worldSnapshot() };
  const json = JSON.stringify(doc.world);
  if (json === memory.lastJson) return;
  memory.lastJson = json; memory.saved = doc;
  try { localStorage.setItem(memoryKey(), JSON.stringify(doc)); } catch {}
  if (player && memory.cloud) {
    player.data.set(doc, { namespace: CONFIG.saveNs })
      .catch((e) => e && e.current ? player.data.set(doc, { namespace: CONFIG.saveNs, version: e.current.version }) : Promise.reject(e))
      .catch((e) => { if (e && (e.status === 401 || e.status === 403)) memory.cloud = false; });
  }
  const tag = document.getElementById("saved");
  if (tag) { tag.classList.add("on"); setTimeout(() => tag.classList.remove("on"), 1600); }
}

/** Once a second: offer my copy if it beats the live raft (the host simply loads it). */
function offerMemory() {
  if (ATTRACT || !memory.ready) return;
  const mine = memory.saved, live = liveRev(), better = mine && mine.rev > live;
  if (isHost()) {
    if (memory.offerRev) clearOffer();
    if (better && live >= 0 && loadWorld(mine.world, mine.rev)) memoryAdopted("");
    return;
  }
  if (better && memory.offerRev !== mine.rev) {
    const json = JSON.stringify(mine.world), fields = {}, n = Math.ceil(json.length / 1900);
    if (n > 40) return; // too big for my entity: keep it for when I am host
    for (let i = 0; i < n; i++) fields["wm" + i] = "~" + json.slice(i * 1900, (i + 1) * 1900); // "~" keeps it a string
    net.me.set(fields);
    net.me.set("wmh", JSON.stringify({ room: MP_CONNECT.room, rev: mine.rev, n })); // header last: chunks land first
    memory.offerRev = mine.rev; memory.offerN = n;
  } else if (!better && memory.offerRev) clearOffer();
}
function clearOffer() {
  const fields = { wmh: "" };
  for (let i = 0; i < memory.offerN; i++) fields["wm" + i] = "";
  net.me.set(fields); memory.offerRev = 0; memory.offerN = 0;
}

/** Host, once a second: adopt the best complete offer that beats the live raft. */
function adoptOffers() {
  let best = null;
  for (const id of livePlayers()) {
    const p = S.entities.players[id], h = id !== net.sessionId && parse(p && p.wmh, null);
    if (!h || h.room !== MP_CONNECT.room || !(h.n <= 40) || !(h.rev > liveRev()) || (best && h.rev <= best.rev)) continue;
    let json = "";
    for (let i = 0; i < h.n && json !== null; i++) { const c = p["wm" + i]; json = typeof c === "string" && c[0] === "~" ? json + c.slice(1) : null; }
    const world = parse(json, null);
    if (world) best = { rev: h.rev, world, name: p.n || "A player" };
  }
  if (best && loadWorld(best.world, best.rev)) memoryAdopted(best.name);
}
function memoryAdopted(name) {
  const text = name ? `${name} brought back the raft they saved` : "Welcome back: your saved raft is here";
  toast(text); net.send("memory", { text: name ? text : "The host brought back the raft they saved" });
}
function memoryTick() {
  offerMemory();
  if (isHost() && !ATTRACT) adoptOffers();
  if (performance.now() - memory.lastSave > CONFIG.saveEvery) { memory.lastSave = performance.now(); rememberWorld(); }
}
addEventListener("pagehide", () => rememberWorld());
document.addEventListener("visibilitychange", () => { if (document.hidden) rememberWorld(); });

// ── RAFT ────────────────────────────────────────────────────────────────────────────
// `raft` holds one character per spot, row by row, after a "~" (so it never looks like a number):
//   "." open water · "#" one of the first nine tiles (never breaks) · "a".."c" a tile with 1..3 bites left.
const N = CONFIG.grid, MID = (N - 1) / 2, TAU = Math.PI * 2;
const tileX = (t) => (t - MID) * CONFIG.tile;                // column/row -> world x/z
const toTile = (v) => Math.round(v / CONFIG.tile + MID);
const spotAt = (x, z) => { const tx = toTile(x), ty = toTile(z); return tx >= 0 && ty >= 0 && tx < N && ty < N ? ty * N + tx : -1; };
const spotX = (i) => tileX(i % N), spotZ = (i) => tileX(Math.floor(i / N));
const isTile = (ch) => ch === "#" || (ch >= "a" && ch <= "z");
const tileHp = (ch) => ch === "#" ? Infinity : ch.charCodeAt(0) - 96;
const NEIGHBORS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function neighbors(i) { const x = i % N, y = Math.floor(i / N), out = []; for (const [dx, dy] of NEIGHBORS) { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < N && ny < N) out.push(ny * N + nx); } return out; }
function foundingRaft() { const g = Array(N * N).fill("."); for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) g[(MID + dy) * N + MID + dx] = "#"; return g; }
const decodeRaft = (raw) => { const g = foundingRaft(); if (typeof raw === "string" && raw[0] === "~" && raw.length === N * N + 1) for (let i = 0; i < N * N; i++) if (g[i] !== "#") g[i] = isTile(raw[i + 1]) && raw[i + 1] !== "#" ? raw[i + 1] : "."; return g; };
const encodeRaft = (g) => "~" + g.join("");
/** Can a new tile go on spot i? Open water next to the raft, not on the outer ring. The same check runs everywhere. */
function canBuild(g, i) {
  if (i < 0 || g[i] !== ".") return false;
  const x = i % N, y = Math.floor(i / N);
  return x > 0 && y > 0 && x < N - 1 && y < N - 1 && neighbors(i).some((n) => isTile(g[n]));
}
/** Tiles the shark can bite: breakable, with open water beside them. */
const edgeTiles = (g) => g.map((ch, i) => i).filter((i) => isTile(g[i]) && g[i] !== "#" && neighbors(i).some((n) => g[n] === "."));
const tileCount = (g) => g.reduce((n, ch) => n + (isTile(ch) ? 1 : 0), 0);
const onRaft = (g, x, z) => { const i = spotAt(x, z); return i >= 0 && isTile(g[i]); };
function raftRadius(g) { let r = 3; g.forEach((ch, i) => { if (isTile(ch)) r = Math.max(r, Math.hypot(spotX(i), spotZ(i)) + 1.5); }); return r; }
/** The raft tile nearest (x, z). */
function nearestTile(g, x, z) { let best = -1, bd = Infinity; g.forEach((ch, i) => { if (isTile(ch)) { const d = Math.hypot(spotX(i) - x, spotZ(i) - z); if (d < bd) { bd = d; best = i; } } }); return best; }
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ── SEA ─────────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#8fd8ff");
scene.fog = new THREE.Fog("#a8e2ff", 40, 120);
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 300);
function fit() {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight;
  camera.fov = innerHeight > innerWidth ? 62 : 50; camera.updateProjectionMatrix();
}
addEventListener("resize", fit); addEventListener("orientationchange", fit); fit();
scene.add(new THREE.HemisphereLight("#e6f6ff", "#2d6e9c", 1.25));

function team() {
  const out = [], live = new Set(livePlayers());
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId || !live.has(id)) continue;
    const q = parseOnce("p:" + id, p.p, (raw) => { const o = parse(raw, null); return o && typeof o.x === "number" ? o : null; });
    if (q) out.push({ id, name: p.n || "Sailor", color: p.c || "#ccc", ...q });
  }
  for (const b of botList()) out.push({ ...b, bot: true });
  out.push(me);
  return out;
}
/** A random spot on the first nine tiles (so two people never stand inside each other). */
const aboardSpot = () => ({ x: (Math.random() - 0.5) * 4.6, z: (Math.random() - 0.5) * 4.6 });
function throwAt(x, z) {
  if (me.sunk || me.sw || me.hk || ATTRACT) return;
  throwHook(me, x, z); sfx("throw");
}
function applyChomp() {
  if (me.sunk) return;
  me.sunk = true; me.sunkAt = Date.now(); me.hk = null; me.hx = me.hz = null; sfx("chomp"); // no hook left hanging in the water
  burst(me.x, 0.3, me.z, "#e8f8ff", 20, 5);
  Object.assign(me, { ...aboardSpot(), sw: 0 }); // you wash back aboard once you close the card
  if (ATTRACT) { me.sunk = false; return; }
  const n = tileCount(raftNow()), k = crewNow().hooked?.[net.sessionId] || 0;
  $("sunkSub").textContent = `Your raft has ${n} tiles. You've hooked ${k} thing${k === 1 ? "" : "s"} this trip.`;
  $("sunk").hidden = false; showBoard();
}
function aboard() { me.sunk = false; $("sunk").hidden = true; publish(true); }
function myTick(dt) {
  const g = raftNow();
  if (me.sunk) { if (Date.now() - me.sunkAt > 9000) aboard(); }
  else if (ATTRACT) { if (hosting()) stepBot(me, dt); } // the preview plays you like a bot
  else {
    const len = Math.hypot(input.mx, input.mz), k = len > 1 ? 1 / len : 1, speed = me.sw ? CONFIG.swim : CONFIG.walk;
    me.x += input.mx * k * speed * dt; me.z += input.mz * k * speed * dt;
    if (len > 0.2 && !me.hk) me.a = Math.atan2(input.mx, input.mz);
    const r = Math.hypot(me.x, me.z); if (r > 34) { me.x *= 34 / r; me.z *= 34 / r; }
    me.sw = onRaft(g, me.x, me.z) ? 0 : 1;
    if (me.sw && me.hk && me.hk.phase !== "back") me.hk = null; // no fishing while swimming
    stepHook(me, dt);
  }
  // A bigger raft than I have sailed on: onto the leaderboard (not more than every few seconds).
  const n = tileCount(g);
  if (n > me.best && seenRaft && Date.now() - me.submittedAt > 4000) { me.best = n; me.submittedAt = Date.now(); if (board) board.submit(n).catch(() => {}); }
  publish(false);
}
function publish(force) {
  const now = performance.now();
  if (!force && now - me.lastSend < 100) return; // ~10/s
  me.lastSend = now;
  const r2 = (v) => v === null ? null : Math.round(v * 100) / 100;
  net.me.set("p", JSON.stringify({ x: r2(me.x), z: r2(me.z), a: r2(me.a), sw: me.sw, hx: r2(me.hx), hz: r2(me.hz), hy: r2(me.hy) }));
}
/** Build mode: the green spots next to the raft near me; click/tap one to build it. */
function tryBuild(i) {
  const g = raftNow(), c = crewNow();
  if (!canBuild(g, i)) return false;
  if (c.w < CONFIG.cost.w || c.r < CONFIG.cost.r) { toast(`A tile costs ${CONFIG.cost.w} wood and ${CONFIG.cost.r} rope. Hook more!`); return true; }
  if (hosting()) applyBuild(i, true); else net.send("build", { x: i % N, y: Math.floor(i / N) });
  burst(spotX(i), 0.3, spotZ(i), "#e8f8ff", 10, 3); sfx("build");
  return true;
}

// Everyone else's crew, eased toward where they last said they were (hooks too).
const views = new Map(); // id -> { g, color, x, z, a, hx, hz }
function syncCrew(dt, t) {
  const seen = new Set(), k = 1 - Math.pow(0.001, dt);
  for (const s of team()) {
    if (s === me) continue;
    seen.add(s.id);
    let v = views.get(s.id);
    if (v && v.color !== s.color) { removeCrew(v.g); v = null; }
    if (!v) { v = { g: makeCrew(s.color, ATTRACT ? "" : s.name), color: s.color, x: s.x, z: s.z, a: s.a, hx: s.hx, hz: s.hz }; views.set(s.id, v); }
    const snap = s.bot && hosting();
    v.x += (s.x - v.x) * (snap ? 1 : k); v.z += (s.z - v.z) * (snap ? 1 : k); v.a += Math.atan2(Math.sin(s.a - v.a), Math.cos(s.a - v.a)) * (snap ? 1 : k);
    if (s.hx === null || s.hx === undefined) v.hx = v.hz = null;
    else if (v.hx === null || v.hx === undefined || snap) { v.hx = s.hx; v.hz = s.hz; }
    else { v.hx += (s.hx - v.hx) * k; v.hz += (s.hz - v.hz) * k; }
    poseCrew(v.g, { ...s, x: v.x, z: v.z, a: v.a, hx: v.hx, hz: v.hz }, t);
  }
  for (const [id, v] of views) if (!seen.has(id)) { removeCrew(v.g); views.delete(id); }
  if (me.g && me.g.userData.color !== me.color) { removeCrew(me.g); me.g = null; }
  if (!me.g) { me.g = makeCrew(me.color, ""); me.g.userData.color = me.color; }
  poseCrew(me.g, me, t);
}
/** Two people in one color: the one with the higher sessionId picks a color nobody (and no bot) uses. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => p.c === me.color && id < net.sessionId)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...botList().map((b) => b.color)]), free = COLORS.find((c) => !taken.has(c));
  if (free) { me.color = free; net.me.set("c", free); }
}
// Build-mode ghosts: green spots where a new tile can go, near me.
const ghostMat = new THREE.MeshBasicMaterial({ color: "#5cff9d", transparent: true, opacity: 0.35, depthWrite: false });
const ghostMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1.8, 0.2, 1.8), ghostMat, 64); ghostMesh.frustumCulled = false; ghostMesh.count = 0; scene.add(ghostMesh);
const aimRing = mesh(new THREE.RingGeometry(0.9, 1.15, 32), new THREE.MeshBasicMaterial({ color: "#ffffff", transparent: true, opacity: 0.6, depthWrite: false }), 0, 0.05, 0);
aimRing.rotation.x = -Math.PI / 2; aimRing.visible = false; scene.add(aimRing);
function buildSpotsNear() { const g = raftNow(); return g.map((_, i) => i).filter((i) => canBuild(g, i) && Math.hypot(spotX(i) - me.x, spotZ(i) - me.z) < 9); }
function syncGhosts(t) {
  ghostMesh.count = 0;
  if (!me.building || ATTRACT) return;
  let n = 0;
  for (const i of buildSpotsNear().slice(0, 64)) { M.compose(P3.set(spotX(i), 0.05 + Math.sin(t * 3) * 0.05, spotZ(i)), Q.identity(), i === me.buildSpot ? S3.set(1.05, 1.6, 1.05) : ONE); ghostMesh.setMatrixAt(n++, M); }
  ghostMesh.count = n; ghostMesh.instanceMatrix.needsUpdate = true;
}

// ── HUD ─────────────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
document.body.classList.toggle("touch", touchUI);
document.body.classList.toggle("attract", ATTRACT);
let board = null, netDown = false;
const startedAt = performance.now();
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 3200); }
function setBuilding(on) { me.building = on; $("build").classList.toggle("on", on); }
function hud() {
  if (ATTRACT) { $("net").textContent = ""; return; }
  const c = crewNow(), g = raftNow(), n = tileCount(g), s = sharkNow();
  $("stash").innerHTML = `🪵 ${c.w} &nbsp;🧵 ${c.r}<small>Raft: ${n} tiles</small>`;
  $("build").querySelector("small").textContent = me.building ? "tap a green spot" : `${CONFIG.cost.w} wood + ${CONFIG.cost.r} rope`;
  $("build").firstChild.textContent = me.building ? "DONE" : "BUILD";
  $("build").classList.toggle("poor", c.w < CONFIG.cost.w || c.r < CONFIG.cost.r);
  $("team").innerHTML = team().map((p) => `<div class="${p === me ? "mine" : ""}">${esc(p === me ? "You" : p.name)}${p.sw ? " 🌊" : ""} · ${c.hooked?.[p.id] || 0} hooked<i style="background:${esc(p.color)}"></i></div>`).join("");
  const alert = s.st === "bite" ? "The shark is biting the raft! Hook it!" : s.st === "hunt" ? (me.sw ? "Shark! Get out of the water!" : "The shark is after a swimmer! Hook it!") : me.sw ? "You're swimming. Climb back onto the raft" : "";
  $("alert").textContent = alert; $("alert").classList.toggle("on", !!alert);
  const early = performance.now() - startedAt < 12000;
  $("hint").textContent = touchUI ? "Left thumb walks · tap the sea to throw your hook · tap BUILD to add tiles" : "WASD to walk · click the sea to throw your hook at debris (or the shark) · B to build";
  $("hint").style.opacity = early ? 1 : 0;
  const live = livePlayers().length;
  $("net").textContent = netDown ? "Reconnecting…" : net.offline ? "Offline: playing with bots" : `Online · ${live} player${live === 1 ? "" : "s"}${isHost() ? " · you run the sea" : ""}`;
  if (me.sunk) $("sunkNext").textContent = `You climb back aboard in ${Math.max(0, Math.ceil((me.sunkAt + 9000 - Date.now()) / 1000))}s`;
}
function showBoard() {
  const list = $("board");
  if (!board) { list.innerHTML = `<li class="note">Leaderboards need a connection.</li>`; return; }
  list.innerHTML = `<li class="note">Loading…</li>`;
  board.submit(tileCount(raftNow())).catch(() => null).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score} tiles</span></li>`).join("") : `<li class="note">No rafts yet. Yours is first.</li>`;
  }).catch(() => { list.innerHTML = `<li class="note">Couldn't load the leaderboard.</li>`; });
}
$("aboard").onclick = aboard;

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const keys = new Set(), mouse = { x: 0, y: 0, seen: false };
const MOVE = { w: [0, -1], arrowup: [0, -1], s: [0, 1], arrowdown: [0, 1], a: [-1, 0], arrowleft: [-1, 0], d: [1, 0], arrowright: [1, 0] };
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (MOVE[k] || k === " ") e.preventDefault();
  keys.add(k);
  if (k === "b" && !e.repeat) setBuilding(!me.building);
  if (k === "escape") setBuilding(false);
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
for (const ev of ["pointerdown", "keydown"]) addEventListener(ev, () => { try { audio ||= new AudioContext(); } catch {} }, { once: true });
const cv = renderer.domElement;
cv.addEventListener("contextmenu", (e) => e.preventDefault());
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), seaPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
/** A screen point -> the spot on the sea it points at, through the camera that drew the frame. */
function seaPoint(cx, cy) { ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); return ray.ray.intersectPlane(seaPlane, hit) ? { x: hit.x, z: hit.z } : null; }
/** Click or tap on the world: build on a green spot in build mode, else throw the hook there. */
function act(cx, cy) {
  const p = seaPoint(cx, cy); if (!p) return;
  if (me.building) { const i = spotAt(p.x, p.z); if (!tryBuild(i)) toast("Tap a green spot next to the raft"); return; }
  throwAt(p.x, p.z);
}
// Touch: the left side of the screen is a thumb stick; a tap anywhere else throws (or builds).
const stick = { id: null, x0: 0, y0: 0, dx: 0, dy: 0 };
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (e.pointerType === "mouse") { if (e.button === 0) act(e.clientX, e.clientY); else if (e.button === 2) setBuilding(false); return; }
  if (e.clientX < innerWidth * 0.4 && stick.id === null) { Object.assign(stick, { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0 }); Object.assign($("stick").style, { left: e.clientX + "px", top: e.clientY + "px" }); $("stick").hidden = false; }
  else act(e.clientX, e.clientY);
});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { mouse.x = e.clientX; mouse.y = e.clientY; mouse.seen = true; return; }
  if (e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.x0, dy = e.clientY - stick.y0; const d = Math.hypot(dx, dy);
  if (d > 50) { dx *= 50 / d; dy *= 50 / d; }
  stick.dx = dx; stick.dy = dy; $("stick").firstChild.style.transform = `translate(${dx}px, ${dy}px)`;
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => { if (e.pointerId === stick.id) { stick.id = null; stick.dx = stick.dy = 0; $("stick").hidden = true; } });
$("build").addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); setBuilding(!me.building); });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
function readInput() {
  input.mx = input.mz = 0;
  for (const k of keys) if (MOVE[k]) { input.mx += MOVE[k][0]; input.mz += MOVE[k][1]; }
  if (stick.id !== null) { input.mx = stick.dx / 50; input.mz = stick.dy / 50; }
  me.buildSpot = -1;
  const p = mouse.seen ? seaPoint(mouse.x, mouse.y) : null;
  aimRing.visible = !!p && !me.building && !me.sw && !me.sunk;
  if (p) {
    if (me.building) me.buildSpot = spotAt(p.x, p.z);
    else { const d = Math.hypot(p.x - me.x, p.z - me.z), k = d > CONFIG.hookRange ? CONFIG.hookRange / d : 1; aimRing.position.set(me.x + (p.x - me.x) * k, 0.1, me.z + (p.z - me.z) * k); }
  }
}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
const focus = new THREE.Vector3(), camOff = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; host.acting = host.adopted = false; } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  const t = now / 1000;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.acting = host.adopted = false;
  if (!ATTRACT) readInput();
  myTick(dt);
  stepSea(t, dt); syncRaft(t, dt); syncDebris(dt, t); syncShark(dt, t); syncCrew(dt, t); syncGhosts(t);
  stepBits(dt); stepPops(dt);
  if (ATTRACT) { // the preview: a slow sway that keeps the whole crew in frame
    const crew = team(), cx = crew.reduce((n, c) => n + c.x, 0) / crew.length, cz = crew.reduce((n, c) => n + c.z, 0) / crew.length, a = -0.3 + Math.sin(t * 0.25) * 0.35;
    focus.lerp(P3.set(cx * 0.6, 0, cz * 0.6), 1 - Math.pow(0.3, dt));
    camera.position.set(focus.x + Math.sin(a) * 11.5, 8.5, focus.z + Math.cos(a) * 11.5); camera.lookAt(focus.x, -0.6, focus.z - 0.5);
  } else { // a 3/4 camera that follows me, a little ahead toward the raft's middle
    const tall = innerHeight > innerWidth ? 1.45 : 1;
    camOff.set(0, 15, 11).multiplyScalar(tall);
    focus.lerp(P3.set(me.x * 0.7, 0, me.z * 0.7), 1 - Math.pow(0.003, dt));
    camera.position.copy(focus).add(camOff); camera.lookAt(focus);
  }
  sun.position.set(focus.x + 18, 34, focus.z + 12); sun.target.position.copy(focus);
  renderer.render(scene, camera);
  if (now - lastHud > 120) { lastHud = now; hud(); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("hook", (m, from) => { if (hosting() && m && typeof m.i === "number") applyHook(m.i, from); });
  net.on("smack", () => { if (hosting()) applySmack(); });
  net.on("build", (m) => { if (hosting() && m && Number.isInteger(m.x) && Number.isInteger(m.y) && m.x >= 0 && m.y >= 0 && m.x < N && m.y < N) applyBuild(m.y * N + m.x, true); });
  net.on("chomp", (m) => { if (m && m.to === net.sessionId) applyChomp(); });
  net.on("memory", (m) => { if (m && typeof m.text === "string") toast(m.text.slice(0, 80)); });
  net.onDisconnect(() => { netDown = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { netDown = false; });
  if (!net.offline && typeof MP !== "undefined") { player = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }); board = player.leaderboard(CONFIG.board); }
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...readBots().map((b) => b.color)]);
  Object.assign(me, aboardSpot());
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  if (ATTRACT) {
    Object.assign(CONFIG, { seats: 4, maxDebris: 20, debrisEvery: 0.35, debrisSpread: 16, sharkRestMs: [1500, 2500], sharkBiteMs: 900, drift: 2.4, botThrowMs: [700, 1500] });
    CONFIG.startStash = { w: 60, r: 16 };
    memory.ready = true;
  } else loadMemory();
  setInterval(memoryTick, 1000);
  requestAnimationFrame(frame);
})();
</script>
